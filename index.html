<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kể Chuyện"><meta name="theme-color" content="#ffffff"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>Kể Chuyện Ngày Xưa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;1,400;1,500&family=Be+Vietnam+Pro:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: a quiet white page like a fine printed memoir. One column: who is telling, one question set in a book serif, one record button, then the story tree. Sized for older eyes and hands. Deliberately light-only, as requested. */
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --wash: #f6f5f2;
  --ink: #1b2230;
  --muted: #697080;
  --line: #e4e2dc;
  --accent: #1f3b4d;
  --accent-soft: #eef2f4;
  --lacquer: #8c1d2a;
  --lacquer-ink: #ffffff;
  --gold: #a5844f;
  --ok: #2f6b4f;
  --font-display: "EB Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --font-ui: "Be Vietnam Pro", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 19px; line-height: 1.5; font-weight: 400;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-family: var(--font-display); font-size: 34px; font-weight: 500; letter-spacing: .005em; line-height: 1.1; text-wrap: balance; }
.lang-btn { border: 1px solid var(--ink); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 9px 18px; font-size: 15px; font-weight: 500; letter-spacing: .04em; white-space: nowrap; }
.lang-btn:hover { background: var(--ink); color: var(--bg); }

.label { font-size: 13px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; font-weight: 500; margin: 0 0 10px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 10px 18px; font-size: 17px; font-weight: 400; line-height: 1.2; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.add { border-style: dashed; color: var(--accent); }
.chip.ghost { border-color: transparent; background: transparent; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; padding-inline: 8px; }

.person-form { background: var(--wash); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; font-size: 16px; margin-top: 14px; }
.person-form label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
.person-form input, .person-form select { font: inherit; font-size: 19px; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
.person-form .hint-sm { font-size: 14px; color: var(--muted); }

.prompt { background: var(--wash); border-radius: 16px; padding: 30px 26px 22px; display: flex; flex-direction: column; gap: 16px; }
.prompt-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; font-weight: 500; }
.done-tag { color: var(--ok); text-transform: none; letter-spacing: 0; font-size: 15px; }
.reply-banner { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.prompt-text { font-family: var(--font-display); font-size: clamp(30px, 7vw, 38px); font-weight: 500; line-height: 1.25; margin: 0; text-wrap: pretty; }
.place-hint { margin: -4px 0 0; font-size: 16px; color: var(--accent); display: flex; gap: 8px; align-items: baseline; }
.place-hint::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--gold); }
.prompt-nav { display: flex; gap: 10px; margin-top: 8px; }
.prompt-nav button { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 14px 10px; font-size: 17px; font-weight: 500; line-height: 1.2; }
.prompt-nav button.primary { border-color: var(--ink); }

.recorder { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 4px 0; }
.rec-ring { position: relative; width: 216px; height: 216px; max-width: 100%; display: grid; place-items: center; }
.rec-ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--lacquer) 35%, transparent); background: color-mix(in srgb, var(--lacquer) 7%, transparent); transform: scale(var(--lvl, 0.86)); transition: transform 90ms linear; }
.rec-btn { position: relative; width: 172px; height: 172px; border-radius: 50%; border: none; background: var(--lacquer); color: var(--lacquer-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 22px; font-weight: 500; letter-spacing: .06em; line-height: 1.15; box-shadow: 0 10px 28px -10px color-mix(in srgb, var(--lacquer) 70%, transparent); }
.rec-btn:active { transform: scale(.98); }
.rec-btn .glyph { width: 28px; height: 28px; border-radius: 50%; background: var(--lacquer-ink); }
.recording .rec-btn .glyph { border-radius: 4px; }
.timer { font-family: var(--font-display); font-size: 48px; font-weight: 500; font-variant-numeric: tabular-nums lining-nums; }
.hint { text-align: center; font-size: 18px; color: var(--muted); max-width: 30ch; margin: 0; }
.live-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--lacquer); margin-right: 8px; animation: blink 1.4s infinite; vertical-align: middle; }
@keyframes blink { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } .rec-ring::before { transition: none; } }
.text-link { background: none; border: none; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-size: 16px; padding: 6px; }

.panel { background: var(--wash); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 16px; text-align: center; }
.panel h3 { margin: 0; font-family: var(--font-display); font-size: 28px; font-weight: 500; }
.panel h3.ok { color: var(--ok); }
.panel audio { width: 100%; }
.panel .row { display: flex; gap: 10px; flex-wrap: wrap; }
.big-btn { flex: 1 1 160px; border: 1px solid var(--ink); background: var(--bg); border-radius: 10px; padding: 16px 14px; font-size: 19px; font-weight: 500; line-height: 1.2; }
.big-btn.solid { background: var(--ink); color: var(--bg); }
.big-btn.danger { border-color: var(--lacquer); color: var(--lacquer); }
.big-btn.danger.solid { background: var(--lacquer); color: var(--lacquer-ink); }

section.library { display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--line); padding-top: 24px; }
.lib-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.lib-head h2 { margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 500; }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 22px; color: var(--muted); font-size: 16px; }
details.branch { background: var(--bg); border-top: 1px solid var(--line); }
details.branch:last-child { border-bottom: 1px solid var(--line); }
details.branch > summary { list-style: none; padding: 16px 2px; font-family: var(--font-display); font-weight: 500; font-size: 23px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; cursor: pointer; }
details.branch > summary::-webkit-details-marker { display: none; }
details.branch > summary > span:first-child::before { content: "▸"; color: var(--gold); margin-right: 10px; font-size: 16px; }
details.branch[open] > summary > span:first-child::before { content: "▾"; }
details.branch > summary .count { font-family: var(--font-ui); font-weight: 400; color: var(--muted); font-size: 14px; white-space: nowrap; }
.branch-body { padding: 0 0 20px; display: flex; flex-direction: column; gap: 18px; }
.q-block { display: flex; flex-direction: column; gap: 10px; }
.q-title { font-family: var(--font-display); font-style: italic; font-size: 19px; margin: 0; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
ul.tree { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
ul.tree ul.tree { margin-top: 10px; margin-left: 12px; padding-left: 14px; border-left: 1px solid var(--gold); }
.rec { background: var(--wash); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.rec-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.who { font-weight: 500; color: var(--accent); font-size: 16px; }
.who small { font-weight: 400; color: var(--muted); }
.rec-q { font-size: 16px; margin: 0; min-width: 0; overflow-wrap: anywhere; }
.rec audio { width: 100%; height: 44px; }
.rec-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.small-btn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 14px; font-size: 15px; }
.small-btn.voice { border-color: var(--accent); color: var(--accent); font-weight: 500; }
.small-btn.danger { color: var(--lacquer); border-color: color-mix(in srgb, var(--lacquer) 30%, var(--line)); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 15px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 10px; font-size: 16px; max-width: calc(100% - 32px); text-align: center; z-index: 20; }
</style>

<div class="wrap" id="app">
  <header>
    <h1 data-t="title"></h1>
    <button class="lang-btn" id="langBtn" lang="en"></button>
  </header>

  <section aria-labelledby="whoLabel">
    <p class="label" id="whoLabel" data-t="who"></p>
    <div class="row-wrap" id="people"></div>
    <form class="person-form" id="personForm" hidden>
      <label for="pName"><span data-t="nameLabel"></span>
        <input id="pName" autocomplete="off" required maxlength="40">
      </label>
      <label for="pAddr"><span data-t="addrLabel"></span>
        <select id="pAddr"></select>
        <span class="hint-sm" data-t="addrHint"></span>
      </label>
      <div class="row-wrap">
        <button class="big-btn solid" type="submit" data-t="savePerson"></button>
        <button class="big-btn" type="button" id="pCancel" data-t="cancel"></button>
      </div>
    </form>
  </section>

  <section aria-labelledby="topicLabel">
    <p class="label" id="topicLabel" data-t="topics"></p>
    <nav class="row-wrap" id="topics"></nav>
  </section>

  <article class="prompt" aria-live="polite">
    <div class="reply-banner" id="replyBanner" hidden>
      <span id="replyText"></span>
      <button class="small-btn" id="replyCancel" data-t="cancel"></button>
    </div>
    <div class="prompt-meta"><span id="qCount"></span><span id="qDone" class="done-tag" hidden></span></div>
    <p class="prompt-text" id="qText"></p>
    <p class="place-hint" id="qPlace" hidden></p>
    <div class="prompt-nav">
      <button id="prevBtn" data-t="prev"></button>
      <button id="nextBtn" class="primary" data-t="next"></button>
    </div>
  </article>

  <div class="recorder" id="recorder">
    <div class="rec-ring" id="ring">
      <button class="rec-btn" id="recBtn">
        <span class="glyph" aria-hidden="true"></span>
        <span id="recLabel"></span>
      </button>
    </div>
    <div class="timer" id="timer" hidden>0:00</div>
    <p class="hint" id="hint"></p>
    <button class="text-link" id="pickFile" hidden data-t="pickFile"></button>
    <input type="file" id="captureInput" accept="audio/*" capture hidden>
    <input type="file" id="fileInput" accept="audio/*,video/mp4,video/webm" hidden>
  </div>

  <div class="panel" id="reviewPanel" hidden>
    <h3 data-t="reviewTitle"></h3>
    <audio id="reviewAudio" controls preload="metadata"></audio>
    <div class="row" id="reviewActions">
      <button class="big-btn danger" id="discardBtn" data-t="discard"></button>
      <button class="big-btn solid" id="keepBtn" data-t="keep"></button>
    </div>
    <div class="row" id="discardConfirm" hidden>
      <p style="flex-basis:100%;margin:0;font-size:19px" data-t="confirmDiscard"></p>
      <button class="big-btn" id="discardNo" data-t="noKeep"></button>
      <button class="big-btn danger solid" id="discardYes" data-t="yesDelete"></button>
    </div>
  </div>

  <div class="panel" id="savedPanel" hidden>
    <h3 class="ok">✓ <span data-t="savedTitle"></span></h3>
    <div class="row">
      <button class="big-btn" id="againBtn" data-t="again"></button>
      <button class="big-btn solid" id="nextAfterBtn" data-t="nextQ"></button>
    </div>
  </div>

  <section class="library">
    <div class="lib-head">
      <h2 data-t="libTitle"></h2>
      <div class="row-wrap" role="group">
        <button class="chip" id="viewStory" data-t="byStory"></button>
        <button class="chip" id="viewPerson" data-t="byPerson"></button>
      </div>
    </div>
    <p class="note" data-t="libNote"></p>
    <div class="empty" id="empty" data-t="empty"></div>
    <div id="tree" style="display:flex;flex-direction:column;gap:12px"></div>
    <button class="big-btn solid" id="saveAllBtn" data-t="saveAll" style="flex:none"></button>
  </section>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const T = {
  title: ["Kể Chuyện Ngày Xưa", "Stories from Long Ago"],
  langBtn: ["English", "Tiếng Việt"],
  who: ["Ai đang kể chuyện?", "Who is telling the story?"],
  addPerson: ["+ Thêm người kể", "+ Add a storyteller"],
  edit: ["Sửa", "Edit"],
  nameLabel: ["Tên của bạn", "Your name"],
  addrLabel: ["Câu hỏi tiếng Việt nên gọi bạn là gì?", "What should the Vietnamese questions call you?"],
  addrHint: ["Ví dụ: Bà, Mẹ, Anh, Chị, Bạn", "For example Bà (grandmother), Mẹ (mother), Anh, Chị, or Bạn (neutral)"],
  savePerson: ["Lưu", "Save"],
  cancel: ["Hủy", "Cancel"],
  topics: ["Chủ đề", "Topics"],
  prev: ["← Câu trước", "← Previous"],
  next: ["Câu khác →", "Another question →"],
  told: ["✓ Bạn đã kể câu này", "✓ You've told this one"],
  record: ["Ghi âm", "Record"],
  stop: ["Dừng", "Stop"],
  hintIdle: ["Bấm nút đỏ rồi kể chuyện của bạn.", "Tap the red button, then tell your story."],
  hintRec: ["Đang ghi âm. Bạn cứ kể thong thả.", "Recording. Take your time."],
  hintPhone: ["Bấm nút đỏ, điện thoại của bạn sẽ mở máy ghi âm. Ghi xong, bấm Dùng hoặc Lưu.", "Tap the red button to open your phone's recorder. When you finish, tap Use or Save."],
  pickFile: ["Chọn tệp ghi âm bạn đã có", "Choose a recording you already have"],
  reviewTitle: ["Nghe lại phần bạn vừa kể", "Listen to what you just recorded"],
  keep: ["Lưu lại", "Save it"],
  discard: ["Xóa", "Delete it"],
  confirmDiscard: ["Bạn muốn xóa bản ghi này?", "Do you want to delete this recording?"],
  yesDelete: ["Xóa", "Delete"],
  noKeep: ["Không, giữ lại", "No, keep it"],
  savedTitle: ["Đã lưu", "Saved"],
  again: ["Kể thêm câu này", "Add more to this question"],
  nextQ: ["Câu tiếp theo", "Next question"],
  libTitle: ["Cây chuyện", "Story tree"],
  byStory: ["Theo câu chuyện", "By story"],
  byPerson: ["Theo người kể", "By storyteller"],
  libNote: ["Chuyện của bạn được giữ trong trình duyệt trên máy này. Sau mỗi lần kể, bạn hãy bấm Lưu tất cả về máy để giữ một bản an toàn.", "Your stories stay in this browser on this device. After each session, tap Save all to this device to keep a safe copy."],
  empty: ["Chưa có chuyện nào. Bấm nút đỏ để kể chuyện đầu tiên của bạn.", "No stories yet. Tap the red button to tell your first one."],
  saveAll: ["Lưu tất cả về máy (.zip)", "Save all to this device (.zip)"],
  addVoice: ["+ Thêm giọng kể", "+ Add a voice"],
  saveOne: ["Lưu về máy", "Save to device"],
  del: ["Xóa", "Delete"],
  deleteStory: ["Xóa chuyện này?", "Delete this story?"],
  deleted: ["Đã xóa", "Deleted"],
  savedDevice: ["Đã lưu về máy của bạn", "Saved to your device"],
  tooShort: ["Bản ghi quá ngắn nên chưa được lưu.", "That recording was too short, so it wasn't saved."],
  noMic: ["Micrô bị chặn. Bạn hãy cho phép micrô trong cài đặt trình duyệt, hoặc dùng máy ghi âm của điện thoại.", "Your microphone is blocked. Allow it in your browser settings, or use your phone's recorder."],
  noStore: ["Trình duyệt này không giữ được bản ghi sau khi đóng. Bạn hãy lưu về máy ngay.", "This browser can't keep recordings after it closes. Save them to your device now."],
  noSaveHere: ["Không thể lưu tệp ở đây.", "Saving files isn't available here."],
  noZip: ["Không tải được công cụ nén. Bạn hãy lưu từng chuyện một.", "The zip tool didn't load. Save stories one at a time."],
  replyBanner: ["Bạn đang thêm giọng kể vào câu chuyện của {name}.", "You're adding your voice to {name}'s story."],
  replyTo: ["trả lời {name}", "responding to {name}"],
  recs: ["{n} bản ghi", "{n} recordings"],
  rec1: ["1 bản ghi", "1 recording"],
  placeHint: ["{X} nhớ nói rõ tên nơi chốn: làng, thành phố, tỉnh hoặc tiểu bang, quốc gia.", "Please name the places: village or city, province or state, and country."],
  nameRequired: ["Bạn hãy nhập tên.", "Please enter a name."]
};
const ADDR = ["Bạn", "Bà", "Ông", "Ngoại", "Nội", "Mẹ", "Má", "Ba", "Bố", "Cô", "Chú", "Dì", "Bác", "Anh", "Chị", "Em", "Con", "Cháu"];

// Third item true = the question asks for a specific place, so the later map and timeline step can find it (meta.asksForPlace).
const TOPICS = [
  { id: "child", name: ["Tuổi thơ ở Việt Nam", "Childhood in Vietnam"], qs: [
    ["{X} sinh ra ở đâu? Hãy nói tên làng hoặc xã, huyện, và tỉnh. Nơi đó ra sao?", "Where exactly were you born? Name the village or town, the district and the province. What was it like?", true],
    ["{X} hãy kể về ngôi nhà nơi {x} lớn lên. Nhà ở đường nào, khu nào? Nhà trông như thế nào, có những âm thanh và mùi hương gì?", "Tell us about the house you grew up in. What street or neighborhood was it on? What did it look, sound and smell like?", true],
    ["Cha mẹ của {x} là người như thế nào? Cha mẹ làm nghề gì, ở đâu?", "What were your parents like? What work did they do, and where?", true],
    ["{X} có nhớ ông bà của {x} không? Ông bà sống ở đâu? Hãy kể về ông bà.", "Do you remember your grandparents? Where did they live? Tell us about them.", true],
    ["Trong nhà {x} có mấy anh chị em? Ai thân với {x} nhất?", "How many brothers and sisters did you have? Who were you closest to?"],
    ["Hồi nhỏ {x} hay chơi những trò gì, chơi với ai, chơi ở đâu?", "What games did you play as a child, with whom, and where?"],
    ["Một ngày bình thường hồi nhỏ của {x} bắt đầu và kết thúc như thế nào?", "How did a typical day begin and end for you as a child?"],
    ["Hồi đi học của {x} như thế nào? Trường tên gì, ở đâu? {X} còn nhớ thầy cô hay bạn bè nào không?", "What was school like for you? What was the school called, and where was it? Do you remember a teacher or a friend?", true],

/* ---------- IndexedDB (recordings live in this browser until saved) ---------- */
let idb = null;
function openDB() {
  return new Promise(res => {
    try {
      const r = indexedDB.open("ke-chuyen", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("recs", { keyPath: "id" });
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    } catch { res(null); }
  });
}
function tx(mode, fn) {
  return new Promise(res => {
    if (!idb) return res(null);
    try {
      const tr = idb.transaction("recs", mode); const s = tr.objectStore("recs");
      const r = fn(s); tr.oncomplete = () => res(r ? r.result : true); tr.onerror = () => res(null);
    } catch { res(null); }
  });
}

/* ---------- prompts ---------- */
// Kinship terms (Bà, Mẹ, Anh...) are also third-person words in Vietnamese, so open with "{X} ơi," to make the direct address unmistakable.
function fill(s, addr) {
  const out = s.replaceAll("{X}", addr).replaceAll("{x}", addr.toLowerCase());
  return addr === "Bạn" ? out : `${addr} ơi, ${out.charAt(0).toLowerCase()}${out.slice(1)}`;
}
function promptText(q, addr) { return state.lang === "en" ? q[1] : fill(q[0], addr); }
function current() { const tp = TOPICS[state.topic] || TOPICS[0]; const q = tp.qs[state.q % tp.qs.length]; return { tp, q }; }
function toldSet() { return new Set(state.recs.filter(r => r.meta.speakerId === state.speaker).map(r => r.meta.promptId)); }
function firstUntold(ti) { const told = toldSet(); const i = TOPICS[ti].qs.findIndex(q => !told.has(q.id)); return i < 0 ? 0 : i; }
function saveQ() { store.set("kc.q", state.q); store.set("kc.topic", state.topic); }
function renderTopics() {
  $("topics").innerHTML = "";
  TOPICS.forEach((tp, i) => {
    const b = document.createElement("button");
    b.className = "chip"; b.setAttribute("aria-pressed", i === state.topic); b.textContent = tp.name[L()];
    b.onclick = () => { if (busy()) return; state.topic = i; state.q = firstUntold(i); state.replyTo = null; saveQ(); hidePanels(); render(); };
    $("topics").appendChild(b);
  });
}
function renderPrompt() {
  const { tp, q } = current();
  $("qText").textContent = promptText(q, speaker().addr);
  $("qCount").textContent = `${tp.name[L()]} · ${(state.q % tp.qs.length) + 1}/${tp.qs.length}`;
  $("qPlace").hidden = !q[2]; $("qPlace").textContent = t("placeHint", { X: speaker().addr });
  $("qDone").hidden = !toldSet().has(q.id); $("qDone").textContent = t("told");
  const single = tp.qs.length < 2 || !!state.replyTo;
  $("prevBtn").disabled = single; $("nextBtn").disabled = single;
  const parent = state.replyTo && state.recs.find(r => r.id === state.replyTo);
  $("replyBanner").hidden = !parent;
  if (parent) $("replyText").textContent = t("replyBanner", { name: nameOf(parent.meta.speakerId) });
}
function render() { renderPeople(); renderTopics(); renderPrompt(); }
function busy() { return (rec && rec.state === "recording") || !!state.pending; }
function step(d) { if (busy()) return; const n = current().tp.qs.length; state.q = (state.q + d + n) % n; saveQ(); hidePanels(); renderPrompt(); }
$("prevBtn").onclick = () => step(-1);
$("nextBtn").onclick = () => step(1);
$("replyCancel").onclick = () => { state.replyTo = null; renderPrompt(); };
function goToPrompt(promptId) {
  TOPICS.forEach((tp, ti) => { const qi = tp.qs.findIndex(q => q.id === promptId); if (qi >= 0) { state.topic = ti; state.q = qi; } });
  saveQ();
}

/* ---------- recording ---------- */
let rec = null, chunks = [], stream = null, startAt = 0, tick = null, audioCtx = null, raf = null, wakeLock = null;
function pickMime() {
  const opts = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg;codecs=opus"];
  if (!window.MediaRecorder) return "";
  return opts.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
}
function fmt(sec) { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); }
function inArtifact() { return !!(window.claude && window.claude.use); }

async function startRecording() {
  if (state.pending) return;
  if (state.fallback) { $("captureInput").click(); return; }
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) throw new Error("unsupported");
    stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    useFallback();
    if (e && e.name === "NotAllowedError" && !inArtifact()) toast(t("noMic"));
    return;
  }
  const mime = pickMime();
  try { rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 64000 } : undefined); }
  catch { rec = new MediaRecorder(stream); }
  chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = finishRecording;
  rec.start(1000);
  startAt = Date.now();
  hidePanels();
  $("recorder").classList.add("recording");
  $("recLabel").textContent = t("stop");
  $("timer").hidden = false; $("timer").textContent = "0:00";
  $("hint").innerHTML = `<span class="live-dot"></span>`; $("hint").append(t("hintRec"));
  tick = setInterval(() => { $("timer").textContent = fmt((Date.now() - startAt) / 1000); }, 500);
  meter(stream);
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
}
function meter(s) {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const an = audioCtx.createAnalyser(); an.fftSize = 512;
    audioCtx.createMediaStreamSource(s).connect(an);
    const buf = new Uint8Array(an.fftSize);
    const loop = () => {
      an.getByteTimeDomainData(buf);
      let sum = 0; for (const v of buf) { const x = (v - 128) / 128; sum += x * x; }
      const lvl = Math.min(1, Math.sqrt(sum / buf.length) * 4);
      $("ring").style.setProperty("--lvl", (0.82 + lvl * 0.18).toFixed(3));
      raf = requestAnimationFrame(loop);
    };

  } catch {}
}
function stopRecording() { if (rec && rec.state !== "inactive") rec.stop(); }
function finishRecording() {

  stream && stream.getTracks().forEach(tr => tr.stop());
  try { wakeLock && wakeLock.release(); } catch {} wakeLock = null;
  $("ring").style.removeProperty("--lvl");
  const dur = (Date.now() - startAt) / 1000;
  const type = (rec.mimeType || chunks[0]?.type || "audio/webm").split(";")[0];
  const blob = new Blob(chunks, { type });
  rec = null; chunks = [];
  resetRecorderUI();
  if (blob.size < 1000) { toast(t("tooShort")); return; }
  showReview({ blob, dur, source: "recorded" });
}
function resetRecorderUI() {
  if (rec && rec.state === "recording") { $("recLabel").textContent = t("stop"); return; }
  $("recorder").classList.remove("recording");
  $("timer").hidden = true;
  $("recLabel").textContent = t("record");
  $("hint").textContent = t(state.fallback ? "hintPhone" : "hintIdle");
}
function useFallback() { state.fallback = true; $("pickFile").hidden = false; resetRecorderUI(); }
$("recBtn").onclick = () => (rec && rec.state === "recording") ? stopRecording() : startRecording();
$("pickFile").onclick = () => $("fileInput").click();
async function onPicked(e) {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f) return;
  const dur = await probeDuration(f);
  showReview({ blob: f, dur, source: "imported", origName: f.name });
}
$("captureInput").onchange = onPicked; $("fileInput").onchange = onPicked;
function probeDuration(blob) {
  return new Promise(res => {
    const a = document.createElement("audio"); const u = URL.createObjectURL(blob);
    let settled = false;
    const done = v => { if (settled) return; settled = true; URL.revokeObjectURL(u); res(isFinite(v) ? v : 0); };
    a.preload = "metadata"; a.onloadedmetadata = () => done(a.duration); a.onerror = () => done(0);
    setTimeout(() => done(0), 4000); a.src = u;
  });
}
window.addEventListener("beforeunload", e => { if (busy()) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- review: play back, then save or delete ---------- */
function setAudio(el, blob) { if (el.dataset.url) URL.revokeObjectURL(el.dataset.url); el.dataset.url = blob ? URL.createObjectURL(blob) : ""; el.src = el.dataset.url; }
function showReview(p) {
  state.pending = p;
  setAudio($("reviewAudio"), p.blob);
  $("recorder").hidden = true; $("savedPanel").hidden = true;
  $("reviewPanel").hidden = false; $("reviewActions").hidden = false; $("discardConfirm").hidden = true;
  $("reviewPanel").scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "center" });
}
function endReview() { $("reviewAudio").pause(); setAudio($("reviewAudio"), null); state.pending = null; $("reviewPanel").hidden = true; $("recorder").hidden = false; }
$("keepBtn").onclick = async () => {
  const p = state.pending; if (!p) return;
  endReview();
  await addRecording(p.blob, p.dur, p.source, p.origName);
  $("savedPanel").hidden = false;
};
$("discardBtn").onclick = () => { $("reviewActions").hidden = true; $("discardConfirm").hidden = false; };
$("discardNo").onclick = () => { $("reviewActions").hidden = false; $("discardConfirm").hidden = true; };
$("discardYes").onclick = () => { endReview(); toast(t("deleted")); };
function hidePanels() { $("savedPanel").hidden = true; }
$("againBtn").onclick = () => { hidePanels(); startRecording(); };
$("nextAfterBtn").onclick = () => { hidePanels(); state.replyTo = null; step(1); window.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" }); };
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- library ---------- */
function extFor(type, name) {
  if (name && /\.[a-z0-9]{2,4}$/i.test(name)) return name.split(".").pop().toLowerCase();
  if (type.includes("webm")) return "webm"; if (type.includes("mp4") || type.includes("m4a") || type.includes("aac")) return "mp4";
  if (type.includes("ogg")) return "ogg"; if (type.includes("mpeg")) return "mp3"; if (type.includes("wav")) return "wav";
  return "webm";
}
function stamp(d) { const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
function slug(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[đĐ]/g, "d").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "nguoi-ke"; }
async function addRecording(blob, dur, source, origName) {
  const { tp, q } = current();
  const sp = speaker();
  const now = new Date();
  const ext = extFor(blob.type || "", origName);
  const base = `${stamp(now)}_${q.id}_${slug(sp.name)}`;
  const meta = {
    id: base, recordedAt: now.toISOString(), durationSec: Math.round(dur),
    speakerId: sp.id, speakerName: sp.name, parentId: state.replyTo || null,
    topicId: tp.id, topic_vi: tp.name[0], topic_en: tp.name[1], promptId: q.id,
    prompt_vi: fill(q[0], sp.addr), prompt_en: q[1], asksForPlace: !!q[2], addressTerm: sp.addr,
    mimeType: blob.type || "", source, originalName: origName || null,
    filename: `${base}.${ext}`
  };
  const item = { id: meta.id, blob, meta };
  state.recs.push(item);
  state.replyTo = null;
  const ok = await tx("readwrite", s => s.put(item));
  if (ok === null) toast(t("noStore"));
  renderLibrary(); renderPrompt();
}

const urls = new Map();
function recCard(r, showQuestion) {
  if (!urls.has(r.id)) urls.set(r.id, URL.createObjectURL(r.blob));
  const m = r.meta; const d = new Date(m.recordedAt);
  const li = document.createElement("li");
  const card = document.createElement("div"); card.className = "rec";
  const parent = m.parentId && state.recs.find(x => x.id === m.parentId);
  const locale = state.lang === "en" ? "en-US" : "vi-VN";
  card.innerHTML = `
    <div class="rec-top"><span class="who"></span><span>${d.toLocaleDateString(locale)} · ${fmt(m.durationSec)}</span></div>
    ${showQuestion ? '<p class="rec-q"></p>' : ""}
    <audio controls preload="none"></audio>
    <div class="rec-actions">
      <button class="small-btn voice"></button>
      <button class="small-btn save"></button>
      <button class="small-btn danger del"></button>
    </div>`;
  const who = card.querySelector(".who");
  who.textContent = person(m.speakerId) ? nameOf(m.speakerId) : (m.speakerName || "?");
  if (parent && showQuestion) { const sm = document.createElement("small"); sm.textContent = " · " + t("replyTo", { name: nameOf(parent.meta.speakerId) }); who.appendChild(sm); }
  if (showQuestion) card.querySelector(".rec-q").textContent = questionLabel(m);
  card.querySelector("audio").src = urls.get(r.id);
  const [bVoice, bSave, bDel] = card.querySelectorAll(".rec-actions button");
  bVoice.textContent = t("addVoice"); bSave.textContent = t("saveOne"); bDel.textContent = t("del");
  bVoice.onclick = () => {
    if (busy()) return;
    state.replyTo = r.id; goToPrompt(m.promptId); hidePanels(); render();
    window.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" });
  };
  bSave.onclick = () => saveOne(r);
  bDel.onclick = () => askDelete(card, r);
  li.appendChild(card);
  return li;
}
function questionLabel(m) {
  const q = PROMPTS.get(m.promptId);
  if (state.lang === "en") return m.prompt_en || (q && q[1]) || "";
  return m.prompt_vi || (q && fill(q[0], m.addressTerm || "Bạn")) || "";
}
function buildTree(list, showQuestion) {
  const ids = new Set(list.map(r => r.id));
  const kids = new Map();
  const roots = [];
  for (const r of list) {
    const p = r.meta.parentId;
    if (p && ids.has(p)) { if (!kids.has(p)) kids.set(p, []); kids.get(p).push(r); } else roots.push(r);
  }
  const make = arr => {
    const ul = document.createElement("ul"); ul.className = "tree";
    arr.sort((a, b) => a.meta.recordedAt.localeCompare(b.meta.recordedAt));
    for (const r of arr) { const li = recCard(r, showQuestion); if (kids.has(r.id)) li.appendChild(make(kids.get(r.id))); ul.appendChild(li); }
    return ul;
  };
  return make(roots);
}
function branch(title, count, open) {
  const d = document.createElement("details"); d.className = "branch"; d.open = open;
  const s = document.createElement("summary");
  const a = document.createElement("span"); a.textContent = title;
  const c = document.createElement("span"); c.className = "count"; c.textContent = count === 1 ? t("rec1") : t("recs", { n: count });
  s.append(a, c); d.appendChild(s);
  const body = document.createElement("div"); body.className = "branch-body"; d.appendChild(body);
  return { d, body };
}
function renderLibrary() {
  const box = $("tree"); box.innerHTML = "";
  $("empty").hidden = state.recs.length > 0;
  $("saveAllBtn").hidden = state.recs.length === 0;
  $("viewStory").setAttribute("aria-pressed", state.view === "story");
  $("viewPerson").setAttribute("aria-pressed", state.view === "person");
  if (!state.recs.length) return;
  if (state.view === "story") {
    const byTopic = new Map();
    for (const r of state.recs) { const k = r.meta.topicId; if (!byTopic.has(k)) byTopic.set(k, []); byTopic.get(k).push(r); }
    const order = TOPICS.map(tp => tp.id).concat([...byTopic.keys()].filter(k => !TOPICS.find(tp => tp.id === k)));
    for (const tid of order) {
      const list = byTopic.get(tid); if (!list) continue;
      const tp = TOPICS.find(x => x.id === tid);
      const { d, body } = branch(tp ? tp.name[L()] : (state.lang === "en" ? list[0].meta.topic_en : list[0].meta.topic_vi), list.length, tid === current().tp.id);
      const byQ = new Map();
      for (const r of list) { if (!byQ.has(r.meta.promptId)) byQ.set(r.meta.promptId, []); byQ.get(r.meta.promptId).push(r); }
      const qOrder = (tp ? tp.qs.map(q => q.id) : []).concat([...byQ.keys()].filter(k => !PROMPTS.has(k)));
      for (const qid of qOrder) {
        const qs = byQ.get(qid); if (!qs) continue;
        const blk = document.createElement("div"); blk.className = "q-block";
        const h = document.createElement("p"); h.className = "q-title";
        const pq = PROMPTS.get(qid);
        h.textContent = pq ? (state.lang === "en" ? pq[1] : fill(pq[0], "Bạn")) : questionLabel(qs[0].meta);
        blk.append(h, buildTree(qs, false));
        body.appendChild(blk);
      }
      box.appendChild(d);
    }
  } else {
    const ids = state.people.map(p => p.id);
    const extra = [...new Set(state.recs.map(r => r.meta.speakerId))].filter(id => !ids.includes(id));
    for (const pid of ids.concat(extra)) {
      const list = state.recs.filter(r => r.meta.speakerId === pid); if (!list.length) continue;
      const { d, body } = branch(person(pid) ? nameOf(pid) : (list[0].meta.speakerName || "?"), list.length, pid === state.speaker);
      const ul = document.createElement("ul"); ul.className = "tree";
      list.sort((a, b) => a.meta.recordedAt.localeCompare(b.meta.recordedAt)).forEach(r => ul.appendChild(recCard(r, true)));
      body.appendChild(ul); box.appendChild(d);
    }
  }
}
$("viewStory").onclick = () => { state.view = "story"; store.set("kc.view", "story"); renderLibrary(); };
$("viewPerson").onclick = () => { state.view = "person"; store.set("kc.view", "person"); renderLibrary(); };
function askDelete(card, r) {
  const actions = card.querySelector(".rec-actions");
  const c = document.createElement("div"); c.className = "confirm";
  const label = document.createElement("span"); label.textContent = t("deleteStory");
  const yes = document.createElement("button"); yes.className = "small-btn danger"; yes.textContent = t("yesDelete");
  const no = document.createElement("button"); no.className = "small-btn"; no.textContent = t("noKeep");
  c.append(label, yes, no); actions.replaceWith(c);
  no.onclick = () => c.replaceWith(actions);
  yes.onclick = async () => {
    // Replies to a deleted story move up to its parent so the tree stays connected.
    const children = state.recs.filter(x => x.meta.parentId === r.id);
    for (const ch of children) { ch.meta.parentId = r.meta.parentId || null; await tx("readwrite", s => s.put(ch)); }
    state.recs = state.recs.filter(x => x.id !== r.id);
    if (state.replyTo === r.id) state.replyTo = null;
    if (urls.has(r.id)) { URL.revokeObjectURL(urls.get(r.id)); urls.delete(r.id); }
    await tx("readwrite", s => s.delete(r.id));
    renderLibrary(); renderPrompt(); toast(t("deleted"));
  };
}

/* ---------- saving to the device ---------- */
let downloadsCap;
async function getDownloads() {
  if (downloadsCap !== undefined) return downloadsCap;
  downloadsCap = inArtifact() ? await window.claude.use("downloads").catch(() => null) : null;
  return downloadsCap;
}
async function saveFile(filename, blob) {
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast(t("savedDevice")); return true; }
    catch (e) { if (e && e.code === "declined") return false; toast(t("noSaveHere")); return false; }
  }
  if (inArtifact()) { toast(t("noSaveHere")); return false; }
  const a = document.createElement("a"); const u = URL.createObjectURL(blob);
  a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 10000); return true;
}
function sidecar(m) {
  const parent = m.parentId && state.recs.find(x => x.id === m.parentId);
  return [
    `Người kể / Storyteller: ${m.speakerName}`,
    `Chủ đề / Topic: ${m.topic_vi} / ${m.topic_en}`,
    `Câu hỏi: ${m.prompt_vi}`, `Question: ${m.prompt_en}`,
    parent ? `Trả lời / Responding to: ${parent.meta.speakerName}, ${parent.meta.filename}` : null,
    `Ngày ghi / Recorded: ${m.recordedAt}`, `Thời lượng / Duration: ${fmt(m.durationSec)}`,
    `Tệp / File: ${m.filename}`, ``, `Bản ghi lời (transcript):`, ``
  ].filter(x => x !== null).join("\n");
}
async function saveOne(r) {
  const ext = r.meta.filename.split(".").pop();
  if (["webm", "mp4"].includes(ext) || !inArtifact()) return saveFile(r.meta.filename, r.blob);
  return saveZip([r], r.meta.filename.replace(/\.[^.]+$/, "") + ".zip");
}
async function saveZip(list, name) {
  if (!window.JSZip) { toast(t("noZip")); return; }
  const zip = new JSZip();
  const sorted = [...list].sort((a, b) => a.meta.recordedAt.localeCompare(b.meta.recordedAt));
  for (const r of sorted) {
    zip.file("audio/" + r.meta.filename, r.blob);
    zip.file("prompts/" + r.meta.filename.replace(/\.[^.]+$/, "") + ".txt", sidecar(r.meta));
  }
  zip.file("stories.json", JSON.stringify({
    app: "Kể Chuyện Ngày Xưa", version: 2, exportedAt: new Date().toISOString(), spokenLanguageHint: "vi",
    storytellers: state.people, recordings: sorted.map(r => r.meta)
  }, null, 2));
  zip.file("README.txt", "audio/ holds one file per answer. prompts/ holds the question each file answers and who told it. stories.json lists the storytellers and every recording with its topic, asksForPlace (true when the question asked for specific places, for map links later), question (Vietnamese and English), storyteller, date, length, and parentId when it responds to another recording, so the stories can be rebuilt as a tree.\n");
  const blob = await zip.generateAsync({ type: "blob", compression: "STORE" });
  return saveFile(name, blob);
}
$("saveAllBtn").onclick = () => saveZip(state.recs, `ke-chuyen-ngay-xua_${stamp(new Date())}.zip`);

let toastT;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3800); }

/* ---------- boot ---------- */
(async () => {
  if (state.topic >= TOPICS.length) state.topic = 0;
  // Inside a claude.ai artifact the browser microphone is not available, so record with the phone's own recorder instead.
  if (inArtifact() || !navigator.mediaDevices || !window.MediaRecorder) state.fallback = true;
  if (state.fallback) $("pickFile").hidden = false;
  applyLang();
  idb = await openDB();
  const all = await tx("readonly", s => s.getAll());
  if (all && all.length) {
    for (const r of all) if (!r.meta.speakerId) { r.meta.speakerId = state.people[0].id; r.meta.speakerName = state.people[0].name; r.meta.parentId = null; }
    state.recs = all; renderLibrary(); renderPrompt();
  }
})();
</script>
</body></html>
